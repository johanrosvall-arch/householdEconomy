services:
  postgres:
    image: postgres:16-alpine
    container_name: household-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: household
      POSTGRES_PASSWORD: household
      POSTGRES_DB: household
    ports:
      - '5432:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U household -d household']
      interval: 5s
      timeout: 5s
      retries: 10
